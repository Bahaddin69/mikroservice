upstream frontend_app {
    server payment_frontend:80;
}

upstream user_api {
    server user_service:9000;
}

upstream catalog_api {
    server catalog_service:9001;
}

upstream order_api {
    server order_service:9002;
}

upstream payment_api {
    server payment_service:9003;
}

upstream email_api {
    server email_service:9005;
}

upstream cargo_api {
    server cargo_service:9006;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_headers on;


    location / {
        proxy_pass http://frontend_app/;
    }

    # ---------- AUTH ----------s
    location /api/auth/ {
        proxy_pass http://user_api/api/auth/;
    }

    # ---------- CATALOG ----------
    location /api/catalog/ {
        proxy_pass http://catalog_api/api/catalog/;
    }

    # ---------- ORDERS ----------
    location /api/orders/ {
        proxy_pass http://order_api/api/orders/;
    }

    location /api/cart/ {
        proxy_pass http://order_api/api/cart/;
    }

    # ---------- PAYMENTS -----------
    location /api/payments/ {
        proxy_pass http://payment_api/api/payments/;
    }

    # ---------- CARGO ----------
    location /api/cargos/ {
        proxy_pass http://cargo_api/api/cargos/;
    }
}
